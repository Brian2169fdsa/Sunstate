<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sun State Transportation — Data Chat</title>
  <link rel="stylesheet" href="project/colors_and_type.css" />
  <link rel="stylesheet" href="project/app.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <style>
    /* ── Login overlay ─────────────────────────────────────────── */
    #loginOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(150deg, #0F1E2E 0%, #1E3348 60%, #1a3a5c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loginCard {
      background: #fff;
      border-radius: 20px;
      padding: 52px 52px 44px;
      width: 480px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 40px 100px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.15);
      animation: cardIn 0.4s cubic-bezier(.22,.68,0,1.15) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    .loginCard__brand {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px;
    }
    .loginCard__mark {
      width: 40px; height: 40px;
      background: #1E3348;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(30,51,72,0.3);
      flex: none;
      overflow: hidden;
      display: grid; place-items: center;
    }
    .loginCard__mark img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .loginCard__powered {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      margin-top: 22px;
      font: 500 11px/1 'Montserrat', system-ui, sans-serif;
      color: #9BAAB8;
      letter-spacing: 0.02em;
    }
    .loginCard__powered img {
      height: 15px; width: auto; opacity: 0.75;
      vertical-align: middle;
    }
    .loginCard__brandName {
      font: 800 15px/1.2 'Montserrat', system-ui, sans-serif;
      letter-spacing: -0.01em;
      color: #1E293B;
    }
    .loginCard__brandSub {
      font: 500 11px/1 'Montserrat', system-ui, sans-serif;
      color: #7A8B9A;
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    .loginCard__title {
      font: 700 24px/1.2 'Montserrat', system-ui, sans-serif;
      letter-spacing: -0.02em;
      color: #1E293B;
      margin: 0 0 6px;
    }
    .loginCard__sub {
      font: 400 14px/1.6 'Montserrat', system-ui, sans-serif;
      color: #475569;
      margin: 0 0 28px;
    }

    .loginCard__err {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #DC2626;
      padding: 10px 14px;
      border-radius: 8px;
      font: 500 13px/1.4 'Montserrat', system-ui, sans-serif;
      margin-bottom: 18px;
      display: none;
    }
    .loginCard__err.show { display: block; }

    .loginCard__label {
      display: block;
      font: 700 11px/1.3 'Montserrat', system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7A8B9A;
      margin-bottom: 7px;
    }
    .loginCard__input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1.5px solid #E2E6EC;
      border-radius: 10px;
      font: 500 14px/1.4 'Montserrat', system-ui, sans-serif;
      color: #1E293B;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 16px;
    }
    .loginCard__input:focus {
      border-color: #4A8FD6;
      box-shadow: 0 0 0 3px rgba(74,143,214,0.14);
    }

    .loginCard__btn {
      width: 100%;
      padding: 13px;
      background: #1E3348;
      color: white;
      border: 0;
      border-radius: 10px;
      font: 700 14px/1 'Montserrat', system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      margin-top: 4px;
    }
    .loginCard__btn:hover:not(:disabled) { background: #14253A; }
    .loginCard__btn:active:not(:disabled) { transform: scale(0.98); }
    .loginCard__btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Logout button (shown after auth) ──────────────────────── */
    #logoutBtn {
      position: fixed; bottom: 22px; right: 22px; z-index: 100;
      display: none;
      align-items: center; gap: 6px;
      padding: 7px 12px 7px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: 600 11px/1 'Montserrat', system-ui, sans-serif;
      color: var(--text-tertiary);
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: color 0.15s, border-color 0.15s;
    }
    #logoutBtn.show { display: flex; }
    #logoutBtn:hover { color: var(--text); border-color: #CFD6DF; }
  </style>

  <script>
    let _supabase = null;
    let _session  = null;

    /* ── Bootstrap: load config → init Supabase → check session ── */
    async function initAuth() {
      let cfg;
      try {
        cfg = await fetch('/api/config').then(r => r.json());
      } catch {
        showLoginError('Could not reach the server. Try refreshing.');
        return;
      }

      _supabase = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

      // Restore persisted session (Supabase stores it in localStorage)
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        _onAuthenticated(session);
      }

      // Keep session state in sync (handles token refresh, sign-out from another tab, etc.)
      _supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          _onAuthenticated(session);
        } else {
          _onSignedOut();
        }
      });
    }

    function _onAuthenticated(session) {
      _session = session;
      window._sunstateSession = session;  // expose token for /api/chat

      // Build display name + initials from user metadata or email
      const meta = session.user.user_metadata || {};
      const fullName = meta.full_name || meta.name || '';
      const email    = session.user.email || '';
      const displayName = fullName || email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const words    = displayName.trim().split(/\s+/);
      const initials = words.length >= 2
        ? (words[0][0] + words[words.length - 1][0]).toUpperCase()
        : displayName.slice(0, 2).toUpperCase();

      window._sunstateUser = { displayName, initials, email };

      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('logoutBtn').classList.add('show');
    }

    function _onSignedOut() {
      _session = null;
      window._sunstateSession = null;  // clear token on sign-out
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('logoutBtn').classList.remove('show');
    }

    /* ── Login form ────────────────────────────────────────────── */
    async function login() {
      const email    = (document.getElementById('emailInput').value    || '').trim();
      const password = (document.getElementById('passwordInput').value || '');
      const btn      = document.getElementById('loginBtn');

      if (!email || !password) {
        showLoginError('Enter your email and password.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      hideLoginError();

      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showLoginError(error.message || 'Sign-in failed. Check your credentials.');
        btn.disabled = false;
        btn.textContent = 'Sign in';
        return;
      }

      // onAuthStateChange fires and calls _onAuthenticated
    }

    async function logout() {
      await _supabase?.auth.signOut();
      // onAuthStateChange fires and calls _onSignedOut
    }

    function showLoginError(msg) {
      const el = document.getElementById('loginErr');
      el.textContent = msg;
      el.classList.add('show');
    }

    function hideLoginError() {
      document.getElementById('loginErr').classList.remove('show');
    }

    /* ── Claude API bridge — passes Supabase JWT for server-side auth ── */
    window.claude = {
      complete: async function (prompt) {
        const token = _session?.access_token;
        const resp = await fetch('/api/claude', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
          },
          body: JSON.stringify({ prompt }),
        });

        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          if (resp.status === 401) _onSignedOut();
          throw new Error(body.error || `API error ${resp.status}`);
        }

        const data = await resp.json();
        return data.text;
      }
    };

    document.addEventListener('DOMContentLoaded', function () {
      initAuth();

      // Enter on password field submits
      document.getElementById('passwordInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') login();
      });
      document.getElementById('emailInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('passwordInput').focus();
      });
    });
  </script>
</head>
<body>

  <!-- ── Login overlay ──────────────────────────────────────── -->
  <div id="loginOverlay">
    <div class="loginCard">

      <div class="loginCard__brand">
        <div class="loginCard__mark">
          <img src="https://sunstatetransport.com/_assets/v11/dbfb5ad9dd63dd155a492df7a041d2ab2de996b5.png"
               alt="Sun State Transportation"
               onerror="this.style.display='none'" />
        </div>
        <div>
          <div class="loginCard__brandName">Sun State Transportation</div>
          <div class="loginCard__brandSub">Data Chat · Internal Portal</div>
        </div>
      </div>

      <h2 class="loginCard__title">Sign in</h2>
      <p class="loginCard__sub">Use your Sun State account credentials.</p>

      <div id="loginErr" class="loginCard__err"></div>

      <label class="loginCard__label" for="emailInput">Email</label>
      <input id="emailInput" class="loginCard__input" type="email"
             placeholder="you@sunstatetransport.com" autocomplete="email" />

      <label class="loginCard__label" for="passwordInput">Password</label>
      <input id="passwordInput" class="loginCard__input" type="password"
             placeholder="••••••••" autocomplete="current-password" />

      <button id="loginBtn" class="loginCard__btn" onclick="login()">Sign in</button>

      <div class="loginCard__powered">
        <span>Powered by</span>
        <img src="https://manageai.io/wp-content/uploads/2026/03/manage_aiArtboard-1.webp"
             alt="Manage AI"
             onerror="this.style.display='none'" />
      </div>
    </div>
  </div>

  <!-- ── React app ───────────────────────────────────────────── -->
  <div id="root"></div>

  <!-- ── Logout button ───────────────────────────────────────── -->
  <button id="logoutBtn" onclick="logout()" title="Sign out">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" y1="12" x2="9" y2="12" />
    </svg>
    Sign out
  </button>

  <script type="text/babel" src="project/app.jsx"></script>
</body>
</html>
